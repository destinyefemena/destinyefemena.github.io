<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lighthouse at Dunmoor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#e4ebec;--fg:#14262e;--muted:#5d7580;--card:#f3f7f7;--line:#b9c8cc;--accent:#0f5c6e;--lamp:#c98a00;--glow:rgba(201,138,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0b161d;--fg:#e3ebec;--muted:#7f98a3;--card:#13232c;--line:#25404c;--accent:#7fc4d4;--lamp:#ffc94a;--glow:rgba(255,201,74,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0b161d;--fg:#e3ebec;--muted:#7f98a3;--card:#13232c;--line:#25404c;--accent:#7fc4d4;--lamp:#ffc94a;--glow:rgba(255,201,74,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.65 Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:34rem;margin:0 auto;padding:22px 20px 56px}
header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.lamp{flex:none;width:18px;height:18px;border-radius:50%;background:var(--line);transition:background .8s,box-shadow .8s}
.lamp.lit{background:var(--lamp);box-shadow:0 0 0 6px var(--glow),0 0 40px 14px var(--glow)}
h1{font-size:1.45rem;line-height:1.2;margin:0;font-weight:700}
.inv{font:15px/1.4 system-ui,-apple-system,sans-serif;color:var(--muted);margin:0 0 26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.scene{margin:0 0 26px}
.scene.past{opacity:.5}
.scene h2{font-size:1.1rem;font-style:italic;font-weight:400;color:var(--accent);margin:0 0 6px}
.scene p{margin:0 0 .8em}
.note{font:15px/1.4 system-ui,-apple-system,sans-serif;color:var(--accent);border-left:3px solid var(--accent);padding-left:10px;margin:0 0 .8em}
#choices{display:grid;gap:10px}
button{font:inherit;font-size:1rem;text-align:left;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;min-height:48px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.again{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
@media (prefers-reduced-motion:reduce){.lamp{transition:none}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b161d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main>
<header><div class="lamp" id="lamp"></div><h1>The Lighthouse at Dunmoor</h1></header>
<p class="inv" id="inv" aria-live="polite"></p>
<div id="story"></div>
<div id="choices"></div>
</main>
<script>
const ITEMS={key:"Brass key",oil:"Oil can",match:"Matches",journal:"Keeper’s journal"};
const S={
start:{t:"The shore",x:["You wake face-down in cold sand. The storm has blown itself out, and the sea is the color of slate.","Above the cliffs, a lighthouse stands with its great lamp dark. Behind you lie the splinters of the boat that brought you here."],
c:[{t:"Search the wreckage",to:"wreck"},{t:"Climb the path to the lighthouse",to:"door"},{t:"Swim toward the faint lights on the horizon",to:"swim"}]},
wreck:{t:"The wreckage",get:["key"],x:["Among the broken planks, a brass key hangs from a loop of wire. The tag on it reads: Dunmoor Light."],
c:[{t:"Climb the path to the lighthouse",to:"door"},{t:"Go back to the shore",to:"start"}]},
door:{t:"The lighthouse door",x:["The tower is taller up close, white paint flaking to bare stone. The oak door is shut tight, and gulls wheel overhead.","A narrow track leads around the side of the building."],
c:[{t:"Unlock the door with the brass key",to:"hall",if:"key"},{t:"Follow the track around the tower",to:"shed"},{t:"Go back down to the shore",to:"start"}]},
shed:{t:"The keeper’s shed",get:["oil","match"],x:["A leaning shed hides from the wind against the tower. Inside, on a shelf swept clean by someone careful, sit a can of lamp oil and a tin of dry matches."],
c:[{t:"Return to the front door",to:"door"}]},
hall:{t:"The ground floor",x:["The door swings open on a round room that smells of salt and old smoke. A spiral staircase climbs into the dark. A hatch in the floor leads down to the cellar."],
c:[{t:"Climb the stairs",to:"top"},{t:"Open the cellar hatch",to:"cellar"},{t:"Step back outside",to:"door"}]},
cellar:{t:"The cellar",get:["journal"],x:["Barrels, coiled rope, and a single stool. On the nearest barrel lies the keeper’s journal, open to the last page.","The final entry is hurried: the lens jams when the cold gets in. Work the crank first, and only then bring the flame."],
c:[{t:"Climb back to the ground floor",to:"hall"}]},
top:{t:"The lamp room",x:()=>{const r=["After a hundred and forty steps you step into a ring of glass. The great lens waits in the middle, dark and heavy, with a brass crank at its base and an empty oil basin beneath."];r.push(inv.has("oil")&&inv.has("match")?"You are carrying everything you need to bring it back to life.":"The basin is bone dry, and you have nothing to light it with. Maybe the keeper left supplies somewhere outside.");return r},
c:[{t:"Fill the lamp, work the crank, and light it",to:"win",if:["oil","match","journal"]},{t:"Fill the lamp and light it",to:"dim",if:["oil","match"],no:"journal"},{t:"Go back down",to:"hall"}]},
swim:{t:"The cold dark",end:1,x:["You wade in and start to swim. The lights on the horizon never seem to get closer, and the water is far colder than it looked.","Dunmoor’s dark tower watches from the cliffs as the current carries you out. Some stories end early, and this is one of them."]},
dim:{t:"A faint glimmer",end:1,x:["The wick catches and a weak yellow glow trembles in the glass. But the lens is frozen in place, and the beam only sputters against the tower wall.","Out on the black water, a ship’s crew sees something that might be a light. They turn away from the rocks, but only just. You made it through the night, and you wonder what the journal would have told you."]},
win:{t:"The beacon",end:1,lit:1,x:["You pour the oil, then lean on the crank until the great lens grinds free of its ice. A match flares in your hand, and the wick takes the flame.","A white beam sweeps across the black water. Far out, a ship’s horn answers, long and low. They saw it. You sit down on the cold iron floor and laugh until the sun comes up."]}
};
const $=s=>document.querySelector(s),story=$("#story"),ch=$("#choices"),inv=new Set();
const ok=c=>[].concat(c.if||[]).every(k=>inv.has(k))&&![].concat(c.no||[]).some(k=>inv.has(k));
function show(){const l=[...inv].map(k=>ITEMS[k]);$("#inv").textContent="Carrying: "+(l.length?l.join(", "):"nothing")}
function go(id){
  const s=S[id],fresh=(s.get||[]).filter(k=>!inv.has(k));
  fresh.forEach(k=>inv.add(k));show();
  story.querySelectorAll(".scene").forEach(e=>e.classList.add("past"));
  const d=document.createElement("section");d.className="scene";
  const h=document.createElement("h2");h.textContent=s.t;d.append(h);
  (typeof s.x==="function"?s.x():s.x).forEach(t=>{const p=document.createElement("p");p.textContent=t;d.append(p)});
  if(fresh.length){const n=document.createElement("p");n.className="note";n.textContent="You take: "+fresh.map(k=>ITEMS[k]).join(", ");d.append(n)}
  story.append(d);
  $("#lamp").classList.toggle("lit",!!s.lit);
  ch.replaceChildren();
  const add=(t,f,cls)=>{const b=document.createElement("button");b.textContent=t;if(cls)b.className=cls;b.onclick=f;ch.append(b)};
  if(s.end)add("Play again",()=>{story.replaceChildren();inv.clear();go("start")},"again");
  else s.c.filter(ok).forEach(c=>add(c.t,()=>go(c.to)));
  d.scrollIntoView({behavior:"smooth",block:"start"});
}
go("start");
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
